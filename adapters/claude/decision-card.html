<title>CARD_TITLE</title>
<!-- Decision card page (trial). decision-card.py fills the CAPS placeholders;
see session.md. Send saves the answer line to the page's db under answers/ID. -->
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--muted:#5b6470;--line:#dde1e6;--btn:#fff;
--ok-bg:#dcf2e3;--ok-fg:#18623a;--pro-bg:#e9e3fb;--pro-fg:#4b2f9e;--q-bg:#fbefd5;--q-fg:#7a4b00;
--on-bg:#1b1f24;--on-fg:#fff;--r:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--fg:#e8eaed;--muted:#9aa3ad;--line:#2c3138;--btn:#1f2329;
--ok-bg:#173826;--ok-fg:#8fdcae;--pro-bg:#2b2448;--pro-fg:#c3b3ff;--q-bg:#3a2c10;--q-fg:#f2c46b;--on-bg:#e8eaed;--on-fg:#15181c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--fg:#e8eaed;--muted:#9aa3ad;--line:#2c3138;--btn:#1f2329;
--ok-bg:#173826;--ok-fg:#8fdcae;--pro-bg:#2b2448;--pro-fg:#c3b3ff;--q-bg:#3a2c10;--q-fg:#f2c46b;--on-bg:#e8eaed;--on-fg:#15181c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.dc{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:0 0 12px;text-wrap:balance}
.dc-s{display:flex;gap:6px;margin-bottom:6px}
.dc-s span{flex:1;padding:8px 10px;border-radius:var(--r);font-size:13px;font-weight:600}
.dc-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.dc-i{font:600 12px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:6px}
.dc-r details{flex:1 1 200px;min-width:0}
.dc-r summary{font-weight:600;cursor:pointer;list-style:none}
.dc-r details p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.dc-r a{color:inherit}
.dc-o{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:8px 14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--btn);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg)}
button[aria-pressed="true"]::before{content:"✓ "}
button:focus-visible{outline:2px solid var(--pro-fg);outline-offset:2px}
.dc-r input{flex-basis:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--fg)}
.dc-f{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.dc-f code{flex:1 1 100%;font:13px ui-monospace,Menlo,monospace;overflow-wrap:anywhere;user-select:all}
#dc-go{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg);font-weight:600}
#dc-m{font-size:13px;color:var(--muted)}
</style>
<main class="dc"><h1 id="dc-h"></h1><div id="dc"></div></main>
<script>
const T=CARD_TITLE_JSON,W=CARD_ID_JSON,D=CARD_DATA;
document.getElementById("dc-h").textContent=T;
const K={accept:["to accept","ok",[["accept","Accept"],["change","Change"],["reject","Reject"]],"accept"],brief:["briefs","pro",[["start","Start"],["later","Not now"]],"start"],q:["questions","q"]};
const S=D.map(x=>x.d||K[x.k][3]),N=D.map(()=>"");
const e=s=>String(s).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const tone=k=>`background:var(--${K[k][1]}-bg);color:var(--${K[k][1]}-fg)`;
const el=document.getElementById("dc");
const cnt={};D.forEach(x=>cnt[x.k]=(cnt[x.k]||0)+1);
el.innerHTML=`<div class="dc-s">${Object.keys(cnt).map(k=>`<span style="${tone(k)}">${cnt[k]} ${K[k][0]}</span>`).join("")}</div>`+D.map((x,i)=>{
const o=x.o||K[x.k][2];
return `<div class="dc-r"><span class="dc-i" style="${tone(x.k)}">${e(x.id)}</span><details><summary>${e(x.t)}</summary>${x.m?`<p>${e(x.m)}</p>`:""}${x.u?`<p><a href="${e(x.u)}">Open</a></p>`:""}</details><span class="dc-o">${o.map(([v,l])=>`<button type="button" data-i="${i}" data-v="${e(v)}">${e(l)}</button>`).join("")}</span><input id="dc-n${i}" data-n="${i}" placeholder="What should change?" hidden></div>`}).join("")+`<div class="dc-f"><code id="dc-a"></code><button type="button" id="dc-cp">Copy</button><button type="button" id="dc-go">Send to the session</button><span id="dc-m"></span></div>`;
const open=i=>/^(change|other)$/.test(S[i]),go=document.getElementById("dc-go");
function ans(){const p=[],b=[];D.forEach((x,i)=>{if(x.k=="brief"){if(S[i]=="start")b.push(x.id)}else p.push(x.id+" "+S[i]+(open(i)&&N[i]?` "${N[i]}"`:""))});if(cnt.brief)p.push("briefs: "+(b.join(",")||"none"));return p.join(", ")}
const msg=t=>document.getElementById("dc-m").textContent=t;
const show=()=>{el.querySelectorAll("button[data-i]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==S[b.dataset.i]));D.forEach((x,i)=>document.getElementById("dc-n"+i).hidden=!open(i));document.getElementById("dc-a").textContent=ans();go.textContent="Send to the session";msg("")};
const ready=()=>{const g=D.findIndex((x,i)=>open(i)&&!N[i]);if(g<0)return true;msg(`Say what you want instead for ${D[g].id}.`);document.getElementById("dc-n"+g).focus();return false};
el.addEventListener("click",ev=>{const b=ev.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i;S[i]=b.dataset.v;show()});
el.addEventListener("input",ev=>{if(ev.target.dataset.n){N[ev.target.dataset.n]=ev.target.value.trim();show()}});
let db=null;window.claude?.use?.("db").then(x=>db=x).catch(()=>{});
go.onclick=async ev=>{const b=ev.currentTarget;if(!ready())return;if(!db){msg("Can't send from here. Tap Copy and paste it into the session.");return}b.disabled=true;try{await db.collection("answers").doc(W).set({answer:ans(),at:new Date().toISOString()});b.disabled=false;b.textContent="Sent";msg("Saved. Reply \"sent\" in the session.")}catch(x){b.disabled=false;msg("Not saved ("+(x&&x.code||"error")+"). Tap Copy and paste it into the session.")}};
document.getElementById("dc-cp").onclick=ev=>{if(!ready())return;const b=ev.currentTarget,sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("dc-a"));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent="Selected"};try{navigator.clipboard.writeText(ans()).then(()=>b.textContent="Copied",sel)}catch(x){sel()}};
show();
</script>
