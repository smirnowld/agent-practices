name: sync-policy

# Keeps the policy block current in every project listed in the Actions
# variable POLICY_SYNC_REPOS (space-separated OWNER/REPO): one sync PR per
# project, updated in place, auto-merge on. See scripts/push-policy-sync.sh.
# Needs the secret POLICY_SYNC_TOKEN: a fine-grained token with Contents and
# Pull requests read-write on those projects. Skipped where the variable is
# unset, so forks do nothing until they configure it.

on:
  push:
    branches: [main]
    paths:
      - policy/**
      - scripts/sync-policy.sh
      - scripts/push-policy-sync.sh
  schedule:
    - cron: "17 6 * * 1" # weekly: retries failures, picks up newly listed projects
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-policy
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    if: vars.POLICY_SYNC_REPOS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync projects
        env:
          GH_TOKEN: ${{ secrets.POLICY_SYNC_TOKEN }}
          REPOS: ${{ vars.POLICY_SYNC_REPOS }}
        run: |
          git config --global user.name "agent-practices sync"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086 # REPOS is a space-separated list
          sh scripts/push-policy-sync.sh $REPOS
